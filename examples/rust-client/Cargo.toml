[package]
name = "guardrino-client-example"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Check a message with Guardrino's inspect API from Rust before sending it to your AI model."
publish = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
