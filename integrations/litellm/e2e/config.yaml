# Used by the e2e suite. Ports come from the environment.
model_list:
  - model_name: mock-gpt
    litellm_params:
      model: openai/mock-gpt
      api_base: os.environ/MOCK_UPSTREAM_URL
      api_key: mock-key

guardrails:
  - guardrail_name: guardrino-input
    litellm_params:
      guardrail: guardrino_litellm.GuardrinoGuardrail
      mode: pre_call
      default_on: true
      api_base: os.environ/GUARDRINO_URL
      tenant: acme
      app: support-bot
      timeout: 2
  - guardrail_name: guardrino-output
    litellm_params:
      guardrail: guardrino_litellm.GuardrinoGuardrail
      mode: post_call
      default_on: true
      api_base: os.environ/GUARDRINO_URL
      tenant: acme
      app: support-bot
      timeout: 2
